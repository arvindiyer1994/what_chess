<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaos Mutation Chess</title>
  <style>
    :root {
      --bg: #12151c;
      --panel: #1b202c;
      --light-sq: #ebecd0;
      --dark-sq: #779556;
      --selected: #f6f669;
      --valid: rgba(34, 197, 94, 0.55);
      --accent: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; justify-items: center; }
    }

    .flag-banner {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 10px;
      background: #232938;
      border-left: 6px solid var(--muted);
    }

    .flag-banner.active {
      background: #2e2412;
      border-left-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.35);
    }

    .flag-tag {
      background: var(--accent);
      color: #111827;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 68px);
      grid-template-rows: repeat(8, 68px);
      border: 4px solid #2b3242;
      border-radius: 6px;
      overflow: hidden;
      user-select: none;
    }

    @media (max-width: 560px) {
      .board {
        grid-template-columns: repeat(8, 44px);
        grid-template-rows: repeat(8, 44px);
      }
      .square { font-size: 30px !important; }
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      cursor: pointer;
      position: relative;
    }

    .square.light { background: var(--light-sq); color: #111827; }
    .square.dark { background: var(--dark-sq); color: #111827; }
    .square.selected { background: var(--selected) !important; }
    .square.valid::after {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--valid);
      border: 2px solid #15803d;
    }

    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    .btn-forfeit { background: var(--danger); }
    .btn-reset { background: #374151; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .mutations-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mut-card {
      background: #131720;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .mut-card h4 { margin: 0 0 6px; font-size: 0.92rem; }

    .history {
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: var(--muted);
      background: #131720;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .history div { padding: 3px 0; border-bottom: 1px solid #1f2533; }
  </style>
</head>
<body>
  <div class="container">
    <div id="flagBanner" class="flag-banner">
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="flag-tag">MUTATION FLAG</span>
        <span id="flagText">Loading...</span>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div class="panel">
      <div class="status-row">
        <div>
          <strong>Turn:</strong> <span id="turnLabel">White</span>
          <div id="lockHint" style="font-size:0.82rem;color:var(--muted);margin-top:2px;">
            Select a piece to begin.
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          <button id="forfeitBtn" class="btn btn-forfeit" onclick="forfeitTurn()">Forfeit Turn</button>
          <button class="btn btn-reset" onclick="resetGame()">Reset</button>
        </div>
      </div>

      <div id="errorBox" class="error-msg"></div>

      <div class="mutations-grid">
        <div class="mut-card">
          <h4>White Active Mutations</h4>
          <div id="whiteMut">None</div>
        </div>
        <div class="mut-card">
          <h4>Black Active Mutations</h4>
          <div id="blackMut">None</div>
        </div>
      </div>

      <div>
        <strong style="font-size:0.9rem;">Log</strong>
        <div id="historyBox" class="history"></div>
      </div>
    </div>
  </div>

  <script>
    const GLYPHS = {
      white: { king: "♔", queen: "♕", rook: "♖", bishop: "♗", knight: "♘", pawn: "♙" },
      black: { king: "♚", queen: "♛", rook: "♜", bishop: "♝", knight: "♞", pawn: "♟" }
    };

    let currentState = null;
    let ws = null;
    let reconnectTimer = null;

    function showError(msg) {
      const box = document.getElementById("errorBox");
      if (!msg) {
        box.style.display = "none";
        box.textContent = "";
      } else {
        box.style.display = "block";
        box.textContent = msg;
      }
    }

    function renderMutations(mapObj) {
      const entries = Object.entries(mapObj || {});
      if (!entries.length) return "None";
      return entries
        .map(([target, mimics]) => `<div><strong>${target}</strong> → moves like <strong>${mimics}</strong></div>`)
        .join("");
    }

    function render(state) {
      currentState = state;

      // Flag Banner
      const banner = document.getElementById("flagBanner");
      const flagText = document.getElementById("flagText");
      flagText.textContent = state.flag.message;
      banner.classList.toggle("active", Boolean(state.flag.active));

      // Turn & Lock Hint
      document.getElementById("turnLabel").textContent = state.turn.toUpperCase();
      const hasSelection = Boolean(state.selected_square);
      document.getElementById("lockHint").textContent = hasSelection
        ? "Piece committed! You must move it to a highlighted square or Forfeit Turn."
        : "Select one of your pieces to move.";

      // Mutations
      document.getElementById("whiteMut").innerHTML = renderMutations(state.mutations.white);
      document.getElementById("blackMut").innerHTML = renderMutations(state.mutations.black);

      // History
      document.getElementById("historyBox").innerHTML =
        (state.history || []).map(item => `<div>${item}</div>`).join("");

      // Board
      const validSet = new Set((state.valid_moves || []).map(([r, c]) => `${r},${c}`));
      const selKey = state.selected_square ? `${state.selected_square[0]},${state.selected_square[1]}` : null;

      const boardEl = document.getElementById("board");
      boardEl.innerHTML = "";

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement("div");
          const isLight = (r + c) % 2 === 0;
          const key = `${r},${c}`;

          sq.className = `square ${isLight ? "light" : "dark"}`;
          if (key === selKey) sq.classList.add("selected");
          if (validSet.has(key)) sq.classList.add("valid");

          const piece = state.board[r][c];
          if (piece) {
            sq.textContent = GLYPHS[piece.color][piece.type];
          }

          sq.onclick = () => onSquareClick(r, c);
          boardEl.appendChild(sq);
        }
      }
    }

    async function onSquareClick(r, c) {
      showError("");
      const validSet = new Set((currentState?.valid_moves || []).map(([mr, mc]) => `${mr},${mc}`));

      if (currentState?.selected_square && validSet.has(`${r},${c}`)) {
        const res = await fetch("/api/move", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ row: r, col: c })
        });
        const data = await res.json();
        if (!data.ok) {
          showError(data.error);
          if (data.state) render(data.state);
        } else if (data.state) {
          render(data.state);
        }
        return;
      }

      const res = await fetch("/api/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ row: r, col: c })
      });
      const data = await res.json();
      if (!data.ok) {
        showError(data.error);
        if (data.state) render(data.state);
      } else if (data.state) {
        render(data.state);
      }
    }

    async function forfeitTurn() {
      showError("");
      const res = await fetch("/api/forfeit", { method: "POST" });
      const data = await res.json();
      if (data.state) render(data.state);
    }

    async function resetGame() {
      showError("");
      const res = await fetch("/api/reset", { method: "POST" });
      const data = await res.json();
      if (data.state) render(data.state);
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${window.location.host}/ws`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "state" && msg.state) {
            render(msg.state);
          }
        } catch (err) {
          console.error("Invalid WS message:", err);
        }
      };

      ws.onclose = () => {
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(connectWebSocket, 1500);
        }
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    (async () => {
      const res = await fetch("/api/state");
      if (res.ok) {
        render(await res.json());
      }
      connectWebSocket();
    })();
  </script>
</body>
</html>
